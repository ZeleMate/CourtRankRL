name: Dependabot automerge

# Turns on auto-merge for Dependabot PRs that are not major updates. The merge still waits
# for the merge gate (ci-ok), which the ruleset requires. Majors stay manual.
# Kept in this repo, not in the central workflow repo, because it holds write permissions.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  automerge:
    # The PR author, not github.actor: anyone who pushes to the branch becomes the actor.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0
        id: metadata
      # A grouped PR reports its highest update type.
      - name: Enable auto-merge for non-major updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
